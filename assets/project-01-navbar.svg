<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="Interactive Navigation Menu">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121A3B"/><stop offset="1" stop-color="#0B1020"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB547"/><stop offset="1" stop-color="#FFB547" stop-opacity="0.1"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="cl"><rect x="1" y="1" width="438" height="234" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#cl)">
    <rect x="1" y="1" width="438" height="234" fill="url(#c)"/>
    <circle cx="400" cy="30" r="70" fill="#FFB547" opacity="0.22" filter="url(#glow)">
      <animate attributeName="opacity" values="0.14;0.32;0.14" dur="4s" repeatCount="indefinite"/>
    </circle>
    <rect x="1" y="1" width="438" height="5" fill="url(#bar)"/>
  </g>
  <rect x="1" y="1" width="438" height="234" rx="16" fill="none" stroke="#26305A" stroke-width="1.5"/>

  <rect x="26" y="26" width="86" height="24" rx="12" fill="#FFB547" fill-opacity="0.14" stroke="#FFB547" stroke-opacity="0.6"/>
  <text x="69" y="42" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" letter-spacing="1.5" fill="#FFB547">TASK 01</text>
  <g transform="translate(358 28)"><rect x="0" y="0" width="46" height="34" rx="7" fill="none" stroke="#FFB547" stroke-width="2"/>
      <rect x="8" y="8" width="30" height="3.5" rx="1.75" fill="#FFB547"/>
      <rect x="8" y="15.5" width="22" height="3.5" rx="1.75" fill="#FFB547" opacity="0.7"/>
      <rect x="8" y="23" width="26" height="3.5" rx="1.75" fill="#FFB547" opacity="0.45"/></g>

  <text x="26" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="#E6EAF7">Interactive Navigation Menu</text>
  <text x="26" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8A94B8">Fixed navbar that turns solid on scroll, highlights the</text>
  <text x="26" y="145" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8A94B8">active section and collapses into a mobile hamburger.</text>
  
    <rect x="26.0" y="163" width="59.0" height="24" rx="12" fill="#FFB547" fill-opacity="0.12" stroke="#FFB547" stroke-opacity="0.5"/>
    <text x="55.5" y="179" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#FFB547">HTML5</text>
    <rect x="93.0" y="163" width="51.6" height="24" rx="12" fill="#FFB547" fill-opacity="0.12" stroke="#FFB547" stroke-opacity="0.5"/>
    <text x="118.8" y="179" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#FFB547">CSS3</text>
    <rect x="152.6" y="163" width="96.0" height="24" rx="12" fill="#FFB547" fill-opacity="0.12" stroke="#FFB547" stroke-opacity="0.5"/>
    <text x="200.6" y="179" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#FFB547">JavaScript</text>
  <line x1="26" y1="204" x2="414" y2="204" stroke="#26305A"/>
  <text x="26" y="224" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#FFB547">View repository</text>
  <text x="410" y="225" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#FFB547">→
    <animate attributeName="x" values="406;416;406" dur="1.8s" repeatCount="indefinite"/>
  </text>
</svg>