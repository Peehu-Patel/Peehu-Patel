<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="Stopwatch Web App">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121A3B"/><stop offset="1" stop-color="#0B1020"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0.1"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="cl"><rect x="1" y="1" width="438" height="234" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#cl)">
    <rect x="1" y="1" width="438" height="234" fill="url(#c)"/>
    <circle cx="400" cy="30" r="70" fill="#00E5FF" opacity="0.22" filter="url(#glow)">
      <animate attributeName="opacity" values="0.14;0.32;0.14" dur="4s" repeatCount="indefinite"/>
    </circle>
    <rect x="1" y="1" width="438" height="5" fill="url(#bar)"/>
  </g>
  <rect x="1" y="1" width="438" height="234" rx="16" fill="none" stroke="#26305A" stroke-width="1.5"/>

  <rect x="26" y="26" width="86" height="24" rx="12" fill="#00E5FF" fill-opacity="0.14" stroke="#00E5FF" stroke-opacity="0.6"/>
  <text x="69" y="42" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" letter-spacing="1.5" fill="#00E5FF">TASK 02</text>
  <g transform="translate(358 28)"><rect x="19" y="-6" width="8" height="5" rx="1.5" fill="#00E5FF"/>
      <circle cx="23" cy="17" r="17" fill="none" stroke="#00E5FF" stroke-width="2.2"/>
      <circle cx="23" cy="17" r="2" fill="#00E5FF"/>
      <line x1="23" y1="17" x2="23" y2="6" stroke="#00E5FF" stroke-width="2.2" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 23 17" to="360 23 17" dur="6s" repeatCount="indefinite"/>
      </line></g>

  <text x="26" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="#E6EAF7">Stopwatch Web App</text>
  <text x="26" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8A94B8">Start, pause, resume, lap and reset with precise</text>
  <text x="26" y="145" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8A94B8">HH:MM:SS.CC timing in a clean, responsive UI.</text>
  
    <rect x="26.0" y="163" width="59.0" height="24" rx="12" fill="#00E5FF" fill-opacity="0.12" stroke="#00E5FF" stroke-opacity="0.5"/>
    <text x="55.5" y="179" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#00E5FF">HTML5</text>
    <rect x="93.0" y="163" width="51.6" height="24" rx="12" fill="#00E5FF" fill-opacity="0.12" stroke="#00E5FF" stroke-opacity="0.5"/>
    <text x="118.8" y="179" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#00E5FF">CSS3</text>
    <rect x="152.6" y="163" width="96.0" height="24" rx="12" fill="#00E5FF" fill-opacity="0.12" stroke="#00E5FF" stroke-opacity="0.5"/>
    <text x="200.6" y="179" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#00E5FF">JavaScript</text>
  <line x1="26" y1="204" x2="414" y2="204" stroke="#26305A"/>
  <text x="26" y="224" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#00E5FF">View repository</text>
  <text x="410" y="225" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#00E5FF">→
    <animate attributeName="x" values="406;416;406" dur="1.8s" repeatCount="indefinite"/>
  </text>
</svg>